<dialog id="organization-dialog" class="dialog">
    <form id="organization-form" class="dialog-content" method="dialog">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">Estructura</p>
          <h2 id="organization-dialog-title">Crear registro</h2>
        </div>
        <button class="quiet-button" value="cancel" type="submit">Cerrar</button>
      </div>
      <div id="organization-form-fields" class="dialog-grid"></div>
      <div class="dialog-actions">
        <button class="quiet-button" value="cancel" type="submit">Cancelar</button>
        <button id="submit-organization-form" class="primary-button" type="button">
          Guardar
        </button>
      </div>
    </form>
  </dialog>
