<dialog id="employee-import-dialog" class="dialog">
    <form id="employee-import-form" class="dialog-content" method="dialog">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">Carga masiva</p>
          <h2>Importar empleados</h2>
        </div>
        <button class="quiet-button" value="cancel" type="submit">Cerrar</button>
      </div>
      <div class="dialog-grid">
        <label class="dialog-wide">Archivo Excel<input name="file" type="file" accept=".xlsx" required /></label>
      </div>
      <div id="employee-import-result" class="import-result" hidden></div>
      <div class="dialog-actions">
        <button class="quiet-button" value="cancel" type="submit">Cancelar</button>
        <button id="submit-employee-import" class="primary-button" type="button">Importar</button>
      </div>
    </form>
  </dialog>
