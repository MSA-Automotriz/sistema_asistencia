<dialog id="request-dialog" class="dialog">
    <form id="request-form" class="dialog-content" method="dialog">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">Autoservicio</p>
          <h2>Nueva solicitud</h2>
        </div>
        <button class="quiet-button" value="cancel" type="submit" formnovalidate data-dialog-close>Cerrar</button>
      </div>
      <div class="dialog-grid">
        <label class="dialog-wide">Tipo de solicitud<select id="request-type" name="requestType" required>
            <option value="WORK_PERMISSION">Permiso laboral</option>
            <option value="OVERTIME">Horas extra</option>
            <option value="VACATION">Vacaciones</option>
            <option value="LICENSE">Licencia</option>
          </select></label>
        <label id="request-start-date-field">Fecha inicial<input name="startDate" type="date" required /></label>
        <label id="request-end-date-field">Fecha final<input name="endDate" type="date" required /></label>
        <label id="request-date-field" hidden>Fecha<input name="date" type="date" /></label>
        <label id="request-minutes-field" hidden>Minutos solicitados<input name="requestedMinutes" type="number" min="1"
            max="720" /></label>
        <label id="request-license-type-field" hidden>Tipo de licencia<input name="licenseType"
            maxlength="100" /></label>
        <label class="dialog-wide">Motivo<textarea name="reason" maxlength="1000" required></textarea>
        </label>
        <label id="request-document-field" class="dialog-wide">
          Sustento / Justificante <span style="font-weight: normal; color: var(--text-muted);">(Opcional: PDF o Foto máx. 5MB)</span>
          <input
            type="file"
            id="request-form-document"
            name="document"
            accept="application/pdf,image/png,image/jpeg,image/webp"
          />
          <span id="request-document-name" class="support-copy" style="display: none; margin-top: 4px; font-weight: 500; color: var(--primary-color);"></span>
        </label>
      </div>
      <div class="dialog-actions">
        <button class="quiet-button" value="cancel" type="submit" formnovalidate data-dialog-close>Cancelar</button>
        <button id="submit-request-form" class="primary-button" type="button">Enviar</button>
      </div>
    </form>
  </dialog>
