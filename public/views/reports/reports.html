<div class="view-heading">
          <div>
            <p class="eyebrow">Exportación</p>
            <h2>Reportes</h2>
          </div>
          <div class="report-actions">
            <button class="small-button" data-report-format="CSV" type="button">CSV</button>
            <button class="small-button" data-report-format="XLSX" type="button">Excel</button>
            <button class="small-button" data-report-format="PDF" type="button">PDF</button>
          </div>
        </div>
        <div class="section-tabs" role="tablist" aria-label="Tipo de reporte">
          <button class="section-tab active" data-report-type="ATTENDANCE" type="button">
            Asistencias
          </button>
          <button class="section-tab" data-report-type="LATE_ARRIVALS" type="button">
            Tardanzas
          </button>
          <button class="section-tab" data-report-type="OVERTIME" type="button">
            Horas extra
          </button>
          <button class="section-tab" data-report-type="WORK_PERMISSIONS" type="button">
            Permisos
          </button>
          <button class="section-tab" data-report-type="VACATIONS" type="button">
            Vacaciones
          </button>
          <button class="section-tab" data-report-type="EMPLOYEES" type="button">
            Empleados
          </button>
          <button class="section-tab" data-report-type="DEPARTMENTS" type="button">Áreas</button>
        </div>
        <form id="report-filter-form" class="filter-bar data-panel">
          <label>Desde<input id="report-start-date" name="startDate" type="date" /></label>
          <label>Hasta<input id="report-end-date" name="endDate" type="date" /></label>
          <button class="primary-button" type="submit">Generar vista previa</button>
        </form>
        <section class="data-panel table-panel">
          <div class="table-wrap">
            <table>
              <thead id="report-table-head"></thead>
              <tbody id="report-table"></tbody>
            </table>
          </div>
        </section>
