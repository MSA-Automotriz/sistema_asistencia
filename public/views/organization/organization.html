<div class="view-heading">
          <div>
            <p class="eyebrow">Estructura</p>
            <h2>Organización</h2>
          </div>
          <div class="inline-actions">
            <button id="open-employee-import" class="quiet-button" type="button" hidden>
              Importar Excel
            </button>
            <button id="open-organization-dialog" class="primary-button" type="button">
              Crear registro
            </button>
          </div>
        </div>
        <div class="section-tabs" role="tablist" aria-label="Módulos organizacionales">
          <button class="section-tab active" data-organization-entity="companies" type="button">
            Empresas
          </button>
          <button class="section-tab" data-organization-entity="sites" type="button">
            Sedes
          </button>
          <button class="section-tab" data-organization-entity="departments" type="button">
            Áreas
          </button>
          <button class="section-tab" data-organization-entity="positions" type="button">
            Cargos
          </button>
          <button class="section-tab" data-organization-entity="schedules" type="button">
            Horarios
          </button>
          <button class="section-tab" data-organization-entity="employees" type="button">
            Empleados
          </button>
          <button class="section-tab" data-organization-entity="site-schedules" type="button">
            Horarios por sede
          </button>
        </div>
        <section class="data-panel table-panel">
          <div class="panel-heading table-heading">
            <div>
              <p class="eyebrow">Listado</p>
              <h3 id="organization-title">Empresas</h3>
            </div>
            <div class="table-toolbar">
              <div class="table-search-wrap">
                <svg class="table-search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input id="organization-search" class="table-search-input" type="search" placeholder="Buscar..." autocomplete="off" />
                <button id="clear-organization-search" class="table-search-clear" type="button" title="Limpiar búsqueda" hidden>&times;</button>
              </div>
              <button id="refresh-organization" class="quiet-button" type="button">
                Actualizar
              </button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead id="organization-table-head"></thead>
              <tbody id="organization-table"></tbody>
            </table>
          </div>
        </section>
