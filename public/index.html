<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e30613" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>MSA Asistencia</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/images/logo_msa_app.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/logo_msa_app.png" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <script src="/vendor/leaflet/leaflet.js"></script>
  <link rel="stylesheet" href="/app.css" />
</head>

<body>
  <main id="auth-screen" class="auth-shell">
    <section class="auth-visual" aria-hidden="true">
      <div class="auth-visual-grid"></div>
      <div class="auth-visual-content">
        <p class="eyebrow eyebrow-light">MSA Automotriz</p>
        <h1>SISTEMA DE<br />ASISTENCIA MSA</h1>
        <div class="signal-stack">
          <span class="signal signal-teal"></span>
          <span class="signal signal-amber"></span>
          <span class="signal signal-coral"></span>
        </div>
      </div>
      <div class="auth-time" id="auth-clock">--:--</div>
    </section>

    <section class="auth-panel">
      <div class="brand-lockup">
        <img id="brand-logo" src="/images/logo_msa_app.png" alt="Logo de MSA Automotriz" />
        <span id="brand-fallback" class="brand-mark" hidden>MSA</span>
        <span>Asistencia</span>
      </div>
      <button class="install-app-button auth-install-button" data-install-app type="button" hidden>
        Instalar app
      </button>

      <div class="auth-card" id="login-card">
        <div class="auth-heading">
          <p class="eyebrow">Acceso</p>
          <h2>Iniciar sesión</h2>
        </div>
        <form id="login-form" class="form-stack">
          <label>
            ID de Usuario (DNI / Correo)
            <input id="login-email" name="email" type="text" autocomplete="username"
              placeholder="Ej: 74839201 o admin@msaautomotriz.com" required />
          </label>
          <label>
            Contraseña
            <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="8"
              required />
          </label>
          <div class="form-row">
            <label class="check-label">
              <input id="remember-me" type="checkbox" />
              <span>Recordarme</span>
            </label>
            <button id="show-recovery" class="text-button" type="button">Recuperar acceso</button>
          </div>
          <button class="primary-button" type="submit">Entrar</button>
        </form>
      </div>

      <div class="auth-card" id="recovery-card" hidden>
        <div class="auth-heading">
          <p class="eyebrow">Recuperación</p>
          <h2>Restablecer acceso</h2>
        </div>
        <form id="recovery-start-form" class="form-stack">
          <label>
            ID de Usuario o Correo
            <input id="recovery-email" type="text" autocomplete="username" placeholder="Ej: 74839201" required />
          </label>
          <button class="primary-button" type="submit">Continuar</button>
          <button class="text-button align-start" data-back-to-login type="button">
            Volver al acceso
          </button>
        </form>
        <form id="recovery-reset-form" class="form-stack" hidden>
          <div id="recovery-questions" class="form-stack compact-stack"></div>
          <label>
            Nueva contraseña
            <input id="recovery-password" type="password" autocomplete="new-password" minlength="12" required />
          </label>
          <button class="primary-button" type="submit">Actualizar contraseña</button>
          <button class="text-button align-start" data-back-to-login type="button">
            Volver al acceso
          </button>
        </form>
      </div>
    </section>
  </main>

  <!-- APLICACIÓN PRINCIPAL -->
  <main id="app-shell" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <img id="sidebar-logo" src="/images/logo_msa.png" alt="MSA Automotriz" />
        <span id="sidebar-fallback" class="brand-mark" hidden>MSA</span>
        <span>Asistencia</span>
      </div>
      <nav class="nav-list" aria-label="Navegación principal">
        <button class="nav-item active" data-view-target="dashboard" type="button">
          Resumen
        </button>
        <button class="nav-item" data-view-target="attendance" type="button">
          Registrar asistencia
        </button>
        <button class="nav-item" data-view-target="history" type="button">Historial</button>
        <button class="nav-item" data-view-target="requests" type="button">Solicitudes</button>
        <button class="nav-item" data-view-target="organization" type="button">
          Organización
        </button>
        <button class="nav-item" data-view-target="reports" type="button">Reportes</button>
        <button class="nav-item" data-view-target="statistics" type="button">Estadísticas</button>
        <button class="nav-item" data-view-target="calendar" type="button">Calendario</button>
        <button class="nav-item" data-view-target="announcements" type="button">Anuncios</button>
        <button class="nav-item" data-view-target="devices" type="button">Dispositivos</button>
        <button class="nav-item" data-view-target="settings" type="button">Configuración</button>
        <button class="nav-item" data-view-target="audit" type="button">Auditoría y logs</button>
        <button class="nav-item" data-view-target="profile" type="button">Mi perfil</button>
        <button class="nav-item" data-view-target="users" type="button">Usuarios</button>
        <button class="nav-item" data-view-target="roles" type="button">Roles y permisos</button>
        <button class="nav-item" data-view-target="sessions" type="button">Sesiones</button>
      </nav>
      <div class="sidebar-footer">
        <a href="/api/docs" target="_blank" rel="noreferrer">API</a>
        <span id="connection-status" class="connection-status">Conectado</span>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <button id="nav-toggle" class="mobile-nav-button" type="button">Menú</button>
        <div>
          <p id="page-kicker" class="eyebrow">Operación</p>
          <h1 id="page-title">Resumen general</h1>
        </div>
        <div class="account-menu">
          <div class="notification-wrap">
            <button id="notification-button" class="notification-button" type="button" aria-label="Abrir notificaciones"
              title="Notificaciones">
              Avisos <span id="notification-count" class="notification-count" hidden>0</span>
            </button>
            <section id="notification-menu" class="notification-menu" hidden>
              <div class="panel-heading">
                <strong>Notificaciones</strong>
                <button id="mark-notifications-read" class="text-button" type="button">
                  Marcar leídas
                </button>
              </div>
              <div class="notification-push-banner" id="push-dropdown-banner">
                <span class="push-status-dot" id="push-status-dot"></span>
                <span id="push-status-label" class="push-status-text">Notificaciones Push</span>
                <button class="small-button text-button" id="push-toggle-btn" type="button">Activar</button>
              </div>
              <div id="notification-list" class="notification-list"></div>
            </section>
          </div>
          <button class="install-app-button compact-install-button" data-install-app type="button" hidden>
            Instalar app
          </button>
          <div class="account-identity">
            <span id="account-initials" class="initials">MS</span>
            <span>
              <strong id="account-name">Cargando</strong>
              <small id="account-role">-</small>
            </span>
          </div>
          <button id="logout-button" class="quiet-button" type="button">Cerrar sesión</button>
        </div>
      </header>

      <div id="app-message" class="app-message" hidden role="status"></div>

      <!-- CONTENEDOR DINÁMICO DE VISTAS -->
      <div id="views-container">
        <!-- Vistas modulares en /views/ inyectadas dinámicamente -->
      </div>
    </section>
  </main>

  <!-- CONTENEDOR DINÁMICO DE MODALES -->
  <div id="dialogs-container">
    <!-- Modales en /views/modals/ inyectados dinámicamente -->
  </div>

  <div id="toast" class="toast" hidden role="alert"></div>
  <script type="module" src="/js/app.js"></script>
</body>

</html>
